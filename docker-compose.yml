version: "3.9"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://brainbolt:brainbolt@postgres:5432/brainbolt?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_BASE_URL=http://web:3000
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=brainbolt
      - POSTGRES_PASSWORD=brainbolt
      - POSTGRES_DB=brainbolt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
